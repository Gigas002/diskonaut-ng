# Example diskonaut config. Copy to:
#   ~/.config/diskonaut/config.toml
# or pass: diskonaut -c /path/to/config.toml

version = 1

[base]
# Use logical file size instead of on-disk block usage (same as `-a` / `--apparent-size`).
apparent-size = false
# Don't scan other filesystems mounted inside the folder: /proc, other disks,
# network mounts (same as `-x` / `--one-file-system`).
one-file-system = false

[keybinds]
# Single-character keys, special names (enter, escape, left, …), or modifiers (ctrl+c).
# Characters match as typed: "D" is Shift+d, "?" works on any layout; "shift+d" means "D".
# Keys diskonaut doesn't know are an error, so a typo can't silently do nothing.
# Arrow keys and Ctrl+f/b/n/p remain available for movement unless you remap the vim keys below.

quit = "q"
delete = "d"
move-left = "h"
move-right = "l"
move-up = "k"
move-down = "j"
enter = "enter"
parent = "escape"
zoom-in = "+"
zoom-out = "-"
reset-zoom = "0"
confirm = "y"
cancel = "n"
